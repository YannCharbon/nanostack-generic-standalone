name: build

on:
  push:
  pull_request:

jobs:
  # Default build: the stack libraries with the POSIX port, as the emulator
  # (mesh-emulator-orchestrator) uses them.
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build mbedTLS v3.0.0
        run: |
          git clone --depth 1 --branch v3.0.0 https://github.com/Mbed-TLS/mbedtls.git ../mbedtls
          cmake -S ../mbedtls -B ../mbedtls -G Ninja -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF -DMBEDTLS_FATAL_WARNINGS=OFF
          ninja -C ../mbedtls
      - name: Build the stack
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH=$PWD/../mbedtls \
                -DCMAKE_C_FLAGS="-std=gnu17 -fpermissive"
          ninja -C build

  # Simulation port (virtual time): its unit tests, then the stack on it.
  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Unit tests of the simulation port
        run: tests/port_sim/run.sh build-port-sim-tests
      - name: Event loop timers, periodic tick against idle-tick skipping
        run: tests/eventloop/run.sh build-eventloop-tests
      - name: FAN 1.1 LFN unicast mechanics in the FHSS
        run: tests/fhss_lfn/run.sh build-fhss-lfn-tests
      - name: Protocol timers, periodic against idle-tick skipping
        run: tests/protocol_timers/run.sh build-protocol-timers-tests
      - name: Build mbedTLS v3.0.0
        run: |
          git clone --depth 1 --branch v3.0.0 https://github.com/Mbed-TLS/mbedtls.git ../mbedtls
          cmake -S ../mbedtls -B ../mbedtls -G Ninja -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF -DMBEDTLS_FATAL_WARNINGS=OFF
          ninja -C ../mbedtls
      - name: Build the stack on the simulation port
        run: |
          cmake -S . -B build-sim -G Ninja -DNANOSTACK_PORT=nanostack_port_sim \
                -DCMAKE_PREFIX_PATH=$PWD/../mbedtls -DCMAKE_C_FLAGS="-std=gnu17 -fpermissive"
          ninja -C build-sim

  # Cortex-M33 with a stub port, mbedTLS from the consumer, MAC in-process,
  # no stdio file system; links a border router and a router (tests/cross).
  cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Fetch mbedTLS v3.0.0
        run: git clone --depth 1 --branch v3.0.0 https://github.com/Mbed-TLS/mbedtls.git ../mbedtls
      - name: Cross-build check
        run: tests/cross/run.sh ../mbedtls build-cross
